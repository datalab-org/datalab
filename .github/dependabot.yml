version: 2
updates:
- package-ecosystem: uv
  directory: "./pydatalab"
  schedule:
    interval: monthly
    day: monday
    time: "05:43"
  target-branch: main
  labels:
  - dependency_updates
  - Python
  versioning-strategy: "increase-if-necessary"
  # Major bumps of production deps fall outside these groups, so each
  # gets its own PR; the limit is raised so they aren't starved out.
  open-pull-requests-limit: 30
  groups:
    python-production:
      applies-to: version-updates
      dependency-type: production
      update-types:
        - minor
        - patch
    python-development:
      applies-to: version-updates
      dependency-type: development
      update-types:
        - major
        - minor
        - patch
  ignore:
    - dependency-name: "bokeh"
      versions: [ ">=3" ]
    - dependency-name: "langchain"
      versions: [ ">=0.3" ]
# Updates GH actions versions as often as needed
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    day: monday
    interval: monthly
    time: "05:33"
  target-branch: main
  labels:
  - dependency_updates
  - CI
  groups:
    github-actions:
      applies-to: version-updates
      dependency-type: production
- package-ecosystem: npm
  directory: "./webapp"
  schedule:
    day: monday
    interval: monthly
    time: "05:33"
  target-branch: main
  labels:
  - dependency_updates
  - javascript
  groups:
    js-production:
      applies-to: version-updates
      dependency-type: production
      update-types:
        - minor
        - patch
    js-development:
      applies-to: version-updates
      dependency-type: development
      update-types:
        - minor
        - patch
  ignore:
    # BokehJS must stay in lockstep with the `bokeh` Python dependency, which is
    # pinned below 3.0 above.
    - dependency-name: "@bokeh/bokehjs"
      versions: [ ">=3" ]
- package-ecosystem: docker
  directories:
    - ".docker/app"
    - ".docker/server"
    - ".docker/mongo"
  schedule:
    day: monday
    interval: monthly
    time: "05:33"
  target-branch: main
  labels:
  - dependency_updates
  - build
