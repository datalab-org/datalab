name: Check dependency licensing
on:
  workflow_dispatch:
  workflow_call:

env:
  UV_VERSION: "0.11.8"
  MIN_PYTHON_VERSION: "3.11"

jobs:
  licensing-checks:
    name: "Check dependency licensing"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - name: Set up minimum Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.MIN_PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ env.UV_VERSION }}
        working-directory: "./pydatalab"
        enable-cache: true

    - name: Run liccheck
      working-directory: ./pydatalab
      run: |
        uv venv
        uv sync --all-extras --dev
        uv export --locked --all-extras --no-hashes --no-dev > requirements.txt
        uv pip install liccheck==0.9.2 'setuptools<82' pip
        uv run --no-sync liccheck -r requirements.txt
