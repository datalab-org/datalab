# This file was edited with the assistance of an AI model and requires human review from the contributor.
# Serves the compiled webapp in the production app image.
server {
    listen 8081;
    server_name _;
    root /app/dist;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Always revalidate by default, notably for `index.html` and the runtime `config.js`.
    add_header Cache-Control "no-cache";

    # Compiled assets have hashed filenames, so can be cached indefinitely.
    location ~ ^/(js|css|fonts|img)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Missing static assets should 404 rather than fall back to the app,
    # e.g., so that the optional `custom/override.css` is skipped cleanly.
    location ~ ^/(custom|logos)/ {
        try_files $uri =404;
    }

    # Everything else is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
