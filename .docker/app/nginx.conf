# Serves the compiled webapp in the production app image.
server {
    listen 8081;
    server_name _;
    root /app/dist;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The entrypoint patches the bundle in place at startup without changing its
    # hashed filenames, so always revalidate rather than caching assets long-term.
    add_header Cache-Control "no-cache";

    # Missing static assets should 404 rather than fall back to the app,
    # e.g., so that the optional `custom/override.css` is skipped cleanly.
    location ~ ^/(js|css|fonts|img|custom|logos)/ {
        try_files $uri =404;
    }

    # Everything else is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
