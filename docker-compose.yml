name: datalab
services:
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    restart: unless-stopped
    environment:
      - VUE_APP_GIT_VERSION
      - VUE_APP_API_URL
      - VUE_APP_LOGO_URL
      - VUE_APP_HOMEPAGE_URL
      - VUE_APP_EDITABLE_INVENTORY
      - VUE_APP_WEBSITE_TITLE
      - VUE_APP_QR_CODE_RESOLVER_URL
      - VUE_APP_AUTOMATICALLY_GENERATE_ID_DEFAULT
      - VUE_APP_ENABLE_LOGIN_PAGE
      - VUE_APP_LOGIN_HIDE_UNAVAILABLE_AUTH
    ports:
      - "8081:8081"

  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: .docker/server/Dockerfile
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${SETUPTOOLS_SCM_PRETEND_VERSION}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /data/logs:/logs
      - /data/files:/app/files
      - /tmp/eln-exports:/tmp/eln-exports
      - /data/backups:/tmp/datalab-backups
    ports:
      - "5001:5001"
    networks:
      - backend
    environment:
      - PYDATALAB_MONGO_URI=mongodb://database:27017/datalabvue
      # Passed through from the host env or `.env` when set, and omitted entirely
      # when not, so that a real deployment can set `APP_URL` in its config file.
      # CI relies on this to point the API at the origin Cypress drives the app from.
      - PYDATALAB_APP_URL
      - WEB_CONCURRENCY=4
      - GUNICORN_CMD_ARGS=--timeout 120 --graceful-timeout 90
      - PORT=5001

  database:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: .docker/mongo/Dockerfile
    volumes:
      - /data/logs:/var/logs/mongod
      - /data/db:/data/db
    restart: unless-stopped
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Development services (`docker compose --profile dev up`).
  #
  # These give a hot-reloading, source-mounted environment for local
  # development.
  # ---------------------------------------------------------------------------
  database-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: .docker/mongo/Dockerfile
    volumes:
      - datalab-dev-dbdata:/data/db
    ports:
      # Published on host port 27018 to avoid clashing with a
      # developer's native MongoDB.
      - "27018:27017"
    networks:
      - backend

  api-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: .docker/server/Dockerfile
      target: dev
    depends_on:
      # The dev server has no restart policy, so it must not boot (and
      # try to create indices) until the database accepts connections
      database-dev:
        condition: service_healthy
    volumes:
      - ./pydatalab:/app
      - datalab-dev-files:/app/files
    ports:
      - "5001:5001"
    networks:
      - backend
    environment:
      - PYDATALAB_MONGO_URI=mongodb://database-dev:27017/datalabvue
      - PYDATALAB_FILE_DIRECTORY=/app/files
      # `app-dev` is always served on 8081, so default to it rather than making
      # every developer set this by hand to be able to log in.
      - PYDATALAB_APP_URL=${PYDATALAB_APP_URL:-http://localhost:8081}

  app-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
      target: dev
    volumes:
      - ./webapp:/app
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - VUE_APP_API_URL=${VUE_APP_API_URL:-http://localhost:5001}
      - CHOKIDAR_USEPOLLING=true

networks:
  backend:
    driver: bridge

volumes:
  datalab-dev-dbdata:
  datalab-dev-files:
